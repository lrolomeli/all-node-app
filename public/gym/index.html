<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rutina de Gym</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f0f;
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            text-align: center;
            padding: 30px 20px 20px;
            position: relative;
        }

        .btn-home {
            position: absolute;
            left: 0;
            top: 30px;
            display: inline-block;
            padding: 8px 16px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            text-decoration: none;
            border-radius: 20px;
            font-size: 14px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .btn-home:hover { background: rgba(255,255,255,0.2); }

        .header h1 {
            font-size: 2em;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .header p {
            color: #888;
            margin-top: 6px;
            font-size: 0.95em;
        }

        /* Block tabs */
        .block-tabs {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 25px 0;
        }

        .block-tab {
            padding: 10px 35px;
            border-radius: 30px;
            border: 2px solid #333;
            background: transparent;
            color: #888;
            font-size: 1em;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 2px;
            transition: all 0.3s;
        }

        .block-tab.active {
            background: #e74c3c;
            border-color: #e74c3c;
            color: #fff;
        }

        /* View toggle */
        .view-toggle {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 20px;
        }

        .view-btn {
            padding: 7px 18px;
            border-radius: 20px;
            border: 1px solid #333;
            background: transparent;
            color: #666;
            font-size: 0.82em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .view-btn.active {
            background: #222;
            border-color: #555;
            color: #fff;
        }

        /* Full view — weekly table */
        .full-view {
            display: none;
            max-width: 1100px;
            margin: 0 auto;
            overflow-x: auto;
        }

        .full-view.visible { display: block; }

        .full-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85em;
        }

        .full-table th {
            background: #1a1a1a;
            color: #888;
            font-size: 0.75em;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 12px 14px;
            text-align: left;
            border-bottom: 2px solid #e74c3c;
            white-space: nowrap;
        }

        .full-table th.day-header {
            color: #fff;
            font-size: 0.85em;
        }

        .full-table td {
            padding: 10px 14px;
            border-bottom: 1px solid #1e1e1e;
            vertical-align: top;
        }

        .full-table tr:hover td { background: #161616; }

        .full-table .block-label {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.75em;
            font-weight: 700;
            letter-spacing: 1px;
            margin-right: 6px;
        }

        .full-table .block-a { background: rgba(231,76,60,0.15); color: #e74c3c; border: 1px solid rgba(231,76,60,0.3); }
        .full-table .block-b { background: rgba(52,152,219,0.15); color: #3498db; border: 1px solid rgba(52,152,219,0.3); }

        .full-table .ex-name { color: #fff; font-weight: 500; }

        .full-table .ex-muscle {
            font-size: 0.75em;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        .full-table .ex-stats {
            font-size: 0.78em;
            color: #e74c3c;
            margin-top: 3px;
            white-space: nowrap;
        }

        .full-table .day-col {
            min-width: 150px;
        }

        .full-table .day-exercises {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .full-table .ex-cell {
            padding: 8px 10px;
            background: #1a1a1a;
            border-radius: 8px;
            border-left: 3px solid #e74c3c;
        }

        .full-table .ex-cell.block-b-cell { border-left-color: #3498db; }

        .day-section-label {
            color: #444;
            font-size: 0.72em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        /* Block tabs hidden in both-view */
        .block-tabs.hidden { display: none; }
        .days-nav.hidden { display: none; }
        .exercises-grid.hidden { display: none; }
        .days-nav {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .day-tab {
            padding: 8px 18px;
            border-radius: 20px;
            border: 2px solid #333;
            background: transparent;
            color: #888;
            font-size: 0.85em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .day-tab.active {
            border-color: #e74c3c;
            color: #e74c3c;
            background: rgba(231, 76, 60, 0.1);
        }

        /* Exercises grid */
        .exercises-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .exercise-card {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 14px;
            padding: 20px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .exercise-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: #e74c3c;
        }

        .exercise-card:hover {
            border-color: #e74c3c;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(231, 76, 60, 0.15);
        }

        .exercise-name {
            font-size: 1em;
            font-weight: 600;
            color: #fff;
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .exercise-muscle {
            display: inline-block;
            padding: 2px 10px;
            background: rgba(231, 76, 60, 0.15);
            border: 1px solid rgba(231, 76, 60, 0.3);
            border-radius: 20px;
            color: #e74c3c;
            font-size: 0.72em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .exercise-stats {
            display: flex;
            gap: 10px;
        }

        .stat {
            background: #252525;
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 0.8em;
            color: #aaa;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .stat span:first-child {
            font-size: 0.7em;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #666;
        }

        .stat span:last-child {
            font-weight: 700;
            color: #e74c3c;
            font-size: 0.95em;
        }

        .exercise-notes {
            margin-top: 10px;
            font-size: 0.8em;
            color: #666;
            font-style: italic;
        }

        /* Media links */
        .media-section {
            margin-top: 12px;
            border-top: 1px solid #2a2a2a;
            padding-top: 10px;
        }

        .media-links {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 8px;
        }

        .media-link {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 10px;
            background: #252525;
            border: 1px solid #333;
            border-radius: 20px;
            color: #aaa;
            text-decoration: none;
            font-size: 0.75em;
            transition: all 0.2s;
        }

        .media-link:hover { background: #333; color: #fff; }

        .media-link .delete-media {
            background: none;
            border: none;
            color: #555;
            cursor: pointer;
            font-size: 0.9em;
            padding: 0;
            line-height: 1;
            transition: color 0.2s;
        }

        .media-link .delete-media:hover { color: #e74c3c; }

        .add-media-btn {
            background: none;
            border: 1px dashed #333;
            border-radius: 20px;
            color: #555;
            font-size: 0.75em;
            padding: 4px 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .add-media-btn:hover { border-color: #e74c3c; color: #e74c3c; }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.open { display: flex; }

        .modal {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 16px;
            padding: 25px;
            width: 90%;
            max-width: 420px;
        }

        .modal h3 {
            color: #fff;
            margin-bottom: 5px;
            font-size: 1em;
        }

        .modal p {
            color: #666;
            font-size: 0.82em;
            margin-bottom: 15px;
        }

        .modal input {
            width: 100%;
            padding: 10px 14px;
            background: #252525;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 0.9em;
            margin-bottom: 10px;
            outline: none;
        }

        .modal input:focus { border-color: #e74c3c; }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 5px;
        }

        .btn-cancel {
            padding: 8px 18px;
            background: #252525;
            border: 1px solid #333;
            border-radius: 8px;
            color: #888;
            cursor: pointer;
            font-size: 0.9em;
        }

        .btn-save {
            padding: 8px 18px;
            background: #e74c3c;
            border: none;
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 600;
        }

        /* Muscle links section */
        .muscles-section {
            max-width: 1000px;
            margin: 30px auto 0;
            background: #1a1a1a;
            border-radius: 14px;
            padding: 20px 25px;
            border: 1px solid #2a2a2a;
        }

        .muscles-section h3 {
            color: #888;
            font-size: 0.75em;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        .muscles-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .muscle-link {
            padding: 6px 14px;
            background: #252525;
            border: 1px solid #333;
            border-radius: 20px;
            color: #aaa;
            text-decoration: none;
            font-size: 0.82em;
            transition: all 0.2s;
        }

        .muscle-link:hover {
            background: #e74c3c;
            border-color: #e74c3c;
            color: #fff;
        }

        .empty-day {
            text-align: center;
            padding: 60px 20px;
            color: #444;
            grid-column: 1 / -1;
        }

        .empty-day h3 { font-size: 1.2em; margin-bottom: 8px; }

        @media (max-width: 600px) {
            .exercises-grid { grid-template-columns: 1fr; }
            .header h1 { font-size: 1.5em; }
            .btn-home { position: static; display: block; width: fit-content; margin: 0 auto 15px; }
        }
    </style>
</head>
<body>

<div class="header">
    <a href="/" class="btn-home">← Inicio</a>
    <h1>💪 Gym Routine</h1>
    <p>Selecciona tu bloque y día</p>
</div>

<div class="block-tabs" id="blockTabs">
    <button class="block-tab active" onclick="selectBlock('A')">BLOQUE A</button>
    <button class="block-tab" onclick="selectBlock('B')">BLOQUE B</button>
</div>

<div class="view-toggle">
    <button class="view-btn active" onclick="setView('day', this)">📅 Por día</button>
    <button class="view-btn" onclick="setView('block', this)">📋 Bloque completo</button>
    <button class="view-btn" onclick="setView('both', this)">🗓 Ambos bloques</button>
</div>

<div class="days-nav" id="daysNav"></div>
<div class="exercises-grid" id="exercisesGrid"></div>
<div class="full-view" id="fullView"></div>

<!-- Add media modal -->
<div class="modal-overlay" id="mediaModal">
    <div class="modal">
        <h3>Agregar referencia</h3>
        <p id="modalExerciseName"></p>
        <input type="url" id="mediaUrl" placeholder="URL del video o imagen (YouTube, etc.)">
        <input type="text" id="mediaLabel" placeholder="Etiqueta (opcional)">
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
            <button class="btn-save" onclick="saveMedia()">Guardar</button>
        </div>
    </div>
</div>

<div class="muscles-section">
    <h3>Referencia de músculos</h3>
    <div class="muscles-grid" id="musclesGrid"></div>
</div>

<script>
    const muscleLinks = {
        "Triceps":          "https://musclewiki.com/exercises/male/triceps",
        "Pecho":            "https://musclewiki.com/machine/male/chest",
        "Cuadriceps":       "https://musclewiki.com/machine/male/quads",
        "Pantorrilla":      "https://musclewiki.com/machine/male/calves",
        "Oblicuos":         "https://musclewiki.com/machine/male/obliques",
        "Espalda Media":    "https://musclewiki.com/machine/male/traps-middle",
        "Espalda Lateral":  "https://musclewiki.com/machine/male/lats",
        "Espalda Baja":     "https://musclewiki.com/machine/male/lowerback",
        "Biceps":           "https://musclewiki.com/machine/male/biceps",
        "Antebrazo":        "https://musclewiki.com/exercises/male/forearms",
        "Hombro":           "https://musclewiki.com/exercises/male/front-shoulders",
        "Trapecio":         "https://musclewiki.com/exercises/male/traps",
        "Abdomen":          "https://musclewiki.com/exercises/male/abdominals",
        "Femoral":          "https://musclewiki.com/exercises/male/hamstrings",
        "Gluteos":          "https://musclewiki.com/exercises/male/glutes"
    };

    const dayLabels = {
        1: "Lunes", 2: "Martes", 3: "Miércoles",
        4: "Jueves", 5: "Viernes", 6: "Sábado", 7: "Domingo"
    };

    let routine = {};
    let gymMedia = {};
    let currentBlock = 'A';
    let currentDay = null;
    let currentView = 'day';
    let modalExercise = null;

    async function loadCSV() {
        const response = await fetch('/gym/routine.csv');
        const text = await response.text();
        const lines = text.trim().split('\n').slice(1);

        lines.forEach(line => {
            const parts = line.split(',');
            const [bloque, dia, muscle, ejercicio, series, repeticiones, notas] = parts;
            if (!bloque || !dia || !ejercicio || !ejercicio.trim()) return;

            const b = bloque.trim();
            const d = parseInt(dia.trim());
            if (isNaN(d)) return;

            if (!routine[b]) routine[b] = {};
            if (!routine[b][d]) routine[b][d] = [];

            routine[b][d].push({
                name: ejercicio.trim(),
                muscle: muscle ? muscle.trim() : '',
                sets: series ? series.trim() : '',
                reps: repeticiones ? repeticiones.trim() : '',
                notes: notas ? notas.trim() : ''
            });
        });
    }

    async function loadMedia() {
        try {
            const res = await fetch('/api/gym/media');
            gymMedia = await res.json();
        } catch (e) {
            gymMedia = {};
        }
    }

    function setView(view, el) {
        currentView = view;
        document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
        el.classList.add('active');

        const blockTabs = document.getElementById('blockTabs');
        const daysNav = document.getElementById('daysNav');
        const grid = document.getElementById('exercisesGrid');
        const fullView = document.getElementById('fullView');

        if (view === 'day') {
            blockTabs.classList.remove('hidden');
            daysNav.classList.remove('hidden');
            grid.classList.remove('hidden');
            fullView.classList.remove('visible');
            renderDays();
        } else {
            blockTabs.classList[view === 'both' ? 'add' : 'remove']('hidden');
            daysNav.classList.add('hidden');
            grid.classList.add('hidden');
            fullView.classList.add('visible');
            renderFullView(view);
        }
    }

    function renderFullView(view) {
        const fullView = document.getElementById('fullView');
        const blocks = view === 'both' ? ['A', 'B'] : [currentBlock];
        const dayLabelsMap = { 1: 'Lunes', 2: 'Martes', 3: 'Miércoles', 4: 'Jueves', 5: 'Viernes', 6: 'Sábado', 7: 'Domingo' };

        // Collect all days across selected blocks
        const allDays = [1, 2, 3, 4, 5, 6, 7];

        let html = '<table class="full-table"><thead><tr><th>Día</th>';

        if (view === 'both') {
            html += '<th>Bloque A</th><th>Bloque B</th>';
        } else {
            html += `<th>Ejercicios — Bloque ${blocks[0]}</th>`;
        }

        html += '</tr></thead><tbody>';

        allDays.forEach(day => {
            const label = dayLabelsMap[day] || `Día ${day}`;

            if (view === 'both') {
                const exA = (routine['A'] || {})[day] || [];
                const exB = (routine['B'] || {})[day] || [];
                if (exA.length === 0 && exB.length === 0) return;

                html += `<tr>
                    <td style="color:#888; font-weight:700; white-space:nowrap;">${label}</td>
                    <td class="day-col">${renderExCells(exA, 'a')}</td>
                    <td class="day-col">${renderExCells(exB, 'b')}</td>
                </tr>`;
            } else {
                const exs = (routine[blocks[0]] || {})[day] || [];
                if (exs.length === 0) return;

                html += `<tr>
                    <td style="color:#888; font-weight:700; white-space:nowrap;">${label}</td>
                    <td class="day-col">${renderExCells(exs, blocks[0].toLowerCase())}</td>
                </tr>`;
            }
        });

        html += '</tbody></table>';
        fullView.innerHTML = html;
    }

    function renderExCells(exercises, block) {
        if (exercises.length === 0) return '<span style="color:#333">—</span>';
        return `<div class="day-exercises">${exercises.map(ex => `
            <div class="ex-cell ${block === 'b' ? 'block-b-cell' : ''}">
                <div class="ex-name">${ex.name}</div>
                ${ex.muscle ? `<div class="ex-muscle">${ex.muscle}</div>` : ''}
                ${(ex.sets || ex.reps) ? `<div class="ex-stats">${ex.sets ? ex.sets + ' series' : ''} ${ex.reps ? '× ' + ex.reps : ''}</div>` : ''}
            </div>
        `).join('')}</div>`;
    }

    function selectBlock(block) {
        currentBlock = block;
        currentDay = null;
        document.querySelectorAll('.block-tab').forEach(t => t.classList.remove('active'));
        event.target.classList.add('active');

        if (currentView === 'day') {
            renderDays();
        } else {
            renderFullView(currentView);
        }
    }

    function renderDays() {
        const nav = document.getElementById('daysNav');
        const days = Object.keys(routine[currentBlock] || {}).map(Number).sort((a, b) => a - b);

        if (currentDay === null || !days.includes(currentDay)) {
            currentDay = days[0] || null;
        }

        nav.innerHTML = days.map(day => {
            const label = dayLabels[day] || `Día ${day}`;
            return `<button class="day-tab ${currentDay === day ? 'active' : ''}" onclick="selectDay(${day}, this)">${label}</button>`;
        }).join('');

        renderExercises();
    }

    function selectDay(day, el) {
        currentDay = day;
        document.querySelectorAll('.day-tab').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        renderExercises();
    }

    function renderExercises() {
        const grid = document.getElementById('exercisesGrid');
        const exercises = (routine[currentBlock] || {})[currentDay] || [];

        if (exercises.length === 0) {
            grid.innerHTML = `<div class="empty-day"><h3>Sin ejercicios</h3><p>No hay ejercicios para este día</p></div>`;
            return;
        }

        grid.innerHTML = exercises.map(ex => {
            const links = gymMedia[ex.name] || [];
            const safeName = ex.name.replace(/'/g, "\\'").replace(/"/g, '&quot;');

            return `
                <div class="exercise-card">
                    <div class="exercise-name">${ex.name}</div>
                    ${ex.muscle ? `<div class="exercise-muscle">${ex.muscle}</div>` : ''}
                    <div class="exercise-stats">
                        ${ex.sets ? `<div class="stat"><span>Series</span><span>${ex.sets}</span></div>` : ''}
                        ${ex.reps ? `<div class="stat"><span>Reps</span><span>${ex.reps}</span></div>` : ''}
                    </div>
                    ${ex.notes ? `<div class="exercise-notes">📝 ${ex.notes}</div>` : ''}
                    <div class="media-section">
                        <div class="media-links">
                            ${links.map(m => `
                                <a href="${m.url}" target="_blank" class="media-link">
                                    🎬 ${m.label || 'Ver'}
                                    <button class="delete-media" onclick="event.preventDefault(); deleteMedia('${safeName}', '${m.id}')">✕</button>
                                </a>
                            `).join('')}
                        </div>
                        <button class="add-media-btn" onclick="openModal('${safeName}')">+ video / imagen</button>
                    </div>
                </div>
            `;
        }).join('');
    }

    function renderMuscleLinks() {
        const grid = document.getElementById('musclesGrid');
        grid.innerHTML = Object.entries(muscleLinks).map(([muscle, url]) =>
            `<a href="${url}" target="_blank" class="muscle-link">${muscle}</a>`
        ).join('');
    }

    // Modal
    function openModal(exerciseName) {
        modalExercise = exerciseName;
        document.getElementById('modalExerciseName').textContent = exerciseName;
        document.getElementById('mediaUrl').value = '';
        document.getElementById('mediaLabel').value = '';
        document.getElementById('mediaModal').classList.add('open');
        setTimeout(() => document.getElementById('mediaUrl').focus(), 100);
    }

    function closeModal() {
        document.getElementById('mediaModal').classList.remove('open');
        modalExercise = null;
    }

    async function saveMedia() {
        const url = document.getElementById('mediaUrl').value.trim();
        const label = document.getElementById('mediaLabel').value.trim();
        if (!url) return;

        try {
            const res = await pinAuth.authenticatedFetch('/api/gym/media', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ exercise: modalExercise, url, label })
            });
            const data = await res.json();
            gymMedia[modalExercise] = data.media;
            closeModal();
            renderExercises();
        } catch (e) {
            alert('Error al guardar');
        }
    }

    async function deleteMedia(exercise, id) {
        try {
            await pinAuth.authenticatedFetch(`/api/gym/media/${encodeURIComponent(exercise)}/${id}`, {
                method: 'DELETE'
            });
            if (gymMedia[exercise]) {
                gymMedia[exercise] = gymMedia[exercise].filter(m => m.id !== id);
                if (gymMedia[exercise].length === 0) delete gymMedia[exercise];
            }
            renderExercises();
        } catch (e) {
            alert('Error al eliminar');
        }
    }

    document.getElementById('mediaModal').addEventListener('click', function(e) {
        if (e.target === this) closeModal();
    });

    // Init — load both CSV and media, then render
    Promise.all([loadCSV(), loadMedia()]).then(() => {
        renderDays();
        renderMuscleLinks();
    });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            color: white;
            padding: 30px;
            text-align: center;
            position: relative;
        }

        .header h1 {
            font-size: 2.2em;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }

        .back-home {
            position: absolute;
            top: 20px;
            left: 20px;
        }

        .btn-home {
            display: inline-block;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            text-decoration: none;
            border-radius: 20px;
            font-size: 14px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn-home:hover {
            background: rgba(255, 255, 255, 0.3);
            color: white;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 30px;
            margin-bottom: 20px;
        }

        .summary-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            border-left: 5px solid;
        }

        .summary-card.income {
            border-left-color: #2ecc71;
        }

        .summary-card.expenses {
            border-left-color: #e74c3c;
        }

        .summary-card.savings {
            border-left-color: #3498db;
        }

        .summary-card.available {
            border-left-color: #f39c12;
        }

        .summary-card h3 {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .summary-card .amount {
            font-size: 2em;
            font-weight: bold;
            color: #333;
        }

        .tabs {
            display: flex;
            background: #f8f9fa;
            border-bottom: 1px solid #e0e0e0;
        }

        .tab {
            flex: 1;
            padding: 15px 20px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            color: #666;
            transition: all 0.3s;
        }

        .tab.active {
            background: white;
            color: #2ecc71;
            border-bottom: 3px solid #2ecc71;
        }

        .tab-content {
            display: none;
            padding: 30px;
        }

        .tab-content.active {
            display: block;
        }

        .form-section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .form-section h3 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.3em;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 0.9em;
        }

        input, select, textarea {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            transition: border-color 0.3s;
            font-family: inherit;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #2ecc71;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(46, 204, 113, 0.4);
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
            padding: 6px 12px;
            font-size: 0.85em;
        }

        .btn-danger:hover {
            background: #c0392b;
        }

        .items-list {
            background: white;
            border-radius: 15px;
            overflow: hidden;
        }

        .items-list h3 {
            background: #f8f9fa;
            padding: 20px;
            margin: 0;
            color: #333;
            border-bottom: 1px solid #e0e0e0;
        }

        .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid #f0f0f0;
        }

        .item:last-child {
            border-bottom: none;
        }

        .item-info {
            flex: 1;
        }

        .item-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .item-category {
            color: #666;
            font-size: 0.9em;
        }

        .item-amount {
            font-size: 1.2em;
            font-weight: bold;
            color: #2ecc71;
        }

        .item-actions {
            display: flex;
            gap: 10px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state h4 {
            margin-bottom: 10px;
            color: #666;
        }

        .progress-bar {
            background: #e0e0e0;
            border-radius: 10px;
            height: 20px;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            transition: width 0.3s;
        }

        .progress-text {
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
        }

        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
            
            .form-grid {
                grid-template-columns: 1fr;
            }
            
            .tabs {
                flex-direction: column;
            }
            
            .item {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
            
            .item-actions {
                width: 100%;
                justify-content: flex-end;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="back-home">
                <a href="/" class="btn-home">← Home</a>
            </div>
            <h1>💰 Budget Manager</h1>
            <p>Track your income, expenses, and savings goals</p>
        </div>
        
        <!-- Dashboard Summary -->
        <div class="dashboard">
            <div class="summary-card income">
                <h3>Monthly Income</h3>
                <div class="amount" id="totalIncome">$0</div>
            </div>
            <div class="summary-card expenses">
                <h3>Fixed Expenses</h3>
                <div class="amount" id="totalExpenses">$0</div>
            </div>
            <div class="summary-card savings">
                <h3>Savings Goals</h3>
                <div class="amount" id="totalSavings">$0</div>
            </div>
            <div class="summary-card available">
                <h3>Available</h3>
                <div class="amount" id="availableMoney">$0</div>
            </div>
        </div>
        
        <!-- Tabs -->
        <div class="tabs">
            <button class="tab active" onclick="showTab('income')">💵 Income</button>
            <button class="tab" onclick="showTab('expenses')">💸 Fixed Expenses</button>
            <button class="tab" onclick="showTab('savings')">🎯 Savings Goals</button>
            <button class="tab" onclick="showTab('activities')">💕 Fun Money</button>
        </div>
        
        <!-- Income Tab -->
        <div id="income" class="tab-content active">
            <div class="form-section">
                <h3>Add Income Source</h3>
                <form id="incomeForm">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="incomeName">Income Source *</label>
                            <input type="text" id="incomeName" placeholder="e.g., Salary, Freelance" required>
                        </div>
                        <div class="form-group">
                            <label for="incomeAmount">Monthly Amount *</label>
                            <input type="number" id="incomeAmount" placeholder="0.00" step="0.01" required>
                        </div>
                        <div class="form-group full-width">
                            <label for="incomeNotes">Notes (optional)</label>
                            <textarea id="incomeNotes" placeholder="Additional details..."></textarea>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Add Income</button>
                </form>
            </div>
            
            <div class="items-list">
                <h3>Income Sources</h3>
                <div id="incomeList"></div>
            </div>
        </div>
        
        <!-- Expenses Tab -->
        <div id="expenses" class="tab-content">
            <div class="form-section">
                <h3>Add Fixed Expense</h3>
                <form id="expenseForm">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="expenseName">Expense Name *</label>
                            <input type="text" id="expenseName" placeholder="e.g., Rent, Utilities" required>
                        </div>
                        <div class="form-group">
                            <label for="expenseAmount">Monthly Amount *</label>
                            <input type="number" id="expenseAmount" placeholder="0.00" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <label for="expenseCategory">Category</label>
                            <select id="expenseCategory">
                                <option value="Housing">🏠 Housing</option>
                                <option value="Utilities">⚡ Utilities</option>
                                <option value="Transportation">🚗 Transportation</option>
                                <option value="Food">🍽️ Food</option>
                                <option value="Insurance">🛡️ Insurance</option>
                                <option value="Debt">💳 Debt Payments</option>
                                <option value="Subscriptions">📱 Subscriptions</option>
                                <option value="Other">📋 Other</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="expenseDueDate">Due Date</label>
                            <input type="number" id="expenseDueDate" placeholder="Day of month (1-31)" min="1" max="31">
                        </div>
                        <div class="form-group full-width">
                            <label for="expenseNotes">Notes (optional)</label>
                            <textarea id="expenseNotes" placeholder="Additional details..."></textarea>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Add Expense</button>
                </form>
            </div>
            
            <div class="items-list">
                <h3>Fixed Expenses</h3>
                <div id="expensesList"></div>
            </div>
        </div>
        
        <!-- Savings Tab -->
        <div id="savings" class="tab-content">
            <div class="form-section">
                <h3>Add Savings Goal</h3>
                <form id="savingsForm">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="savingsName">Goal Name *</label>
                            <input type="text" id="savingsName" placeholder="e.g., Emergency Fund, Vacation" required>
                        </div>
                        <div class="form-group">
                            <label for="savingsTarget">Target Amount *</label>
                            <input type="number" id="savingsTarget" placeholder="0.00" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <label for="savingsMonthly">Monthly Contribution *</label>
                            <input type="number" id="savingsMonthly" placeholder="0.00" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <label for="savingsCurrent">Current Amount</label>
                            <input type="number" id="savingsCurrent" placeholder="0.00" step="0.01" value="0">
                        </div>
                        <div class="form-group full-width">
                            <label for="savingsNotes">Notes (optional)</label>
                            <textarea id="savingsNotes" placeholder="Why is this goal important to you?"></textarea>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Add Savings Goal</button>
                </form>
            </div>
            
            <div class="items-list">
                <h3>Savings Goals</h3>
                <div id="savingsList"></div>
            </div>
        </div>
        
        <!-- Activities Tab -->
        <div id="activities" class="tab-content">
            <div class="form-section">
                <h3>Fun Money Budget</h3>
                <form id="funMoneyForm">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="funName">Activity/Category *</label>
                            <input type="text" id="funName" placeholder="e.g., Date nights, Entertainment" required>
                        </div>
                        <div class="form-group">
                            <label for="funAmount">Monthly Budget *</label>
                            <input type="number" id="funAmount" placeholder="0.00" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <label for="funCategory">Type</label>
                            <select id="funCategory">
                                <option value="Date Nights">💕 Date Nights</option>
                                <option value="Entertainment">🎬 Entertainment</option>
                                <option value="Hobbies">🎨 Hobbies</option>
                                <option value="Travel">✈️ Travel Fund</option>
                                <option value="Shopping">🛍️ Shopping</option>
                                <option value="Dining Out">🍽️ Dining Out</option>
                                <option value="Other">🎉 Other Fun</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="funPriority">Priority</label>
                            <select id="funPriority">
                                <option value="High">🔥 High</option>
                                <option value="Medium">⭐ Medium</option>
                                <option value="Low">💭 Low</option>
                            </select>
                        </div>
                        <div class="form-group full-width">
                            <label for="funNotes">Notes (optional)</label>
                            <textarea id="funNotes" placeholder="What makes this special?"></textarea>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Add Fun Budget</button>
                </form>
            </div>
            
            <div class="items-list">
                <h3>Fun Money Allocations</h3>
                <div id="funMoneyList"></div>
            </div>
        </div>
    </div>
    
    <script src="/auth.js"></script>
    <script>
        let budgetData = {
            income: [],
            expenses: [],
            savings: [],
            funMoney: []
        };
        
        // Load budget data from server
        async function loadBudgetData() {
            try {
                const response = await fetch('/api/budget');
                budgetData = await response.json();
                updateDashboard();
                renderAllLists();
            } catch (error) {
                console.error('Error loading budget data:', error);
            }
        }
        
        // Save budget data to server
        async function saveBudgetData() {
            try {
                await pinAuth.authenticatedFetch('/api/budget', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(budgetData)
                });
            } catch (error) {
                console.error('Error saving budget data:', error);
                alert('Failed to save budget data');
            }
        }
        
        // Delete item
        async function deleteItem(type, id) {
            try {
                await pinAuth.authenticatedFetch(`/api/budget/${type}/${id}`, {
                    method: 'DELETE'
                });
                budgetData[type] = budgetData[type].filter(item => item.id !== id);
                updateDashboard();
                renderAllLists();
            } catch (error) {
                console.error('Error deleting item:', error);
                alert('Failed to delete item');
            }
        }
        
        // Tab switching
        function showTab(tabName) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // Show selected tab
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }
        
        // Update dashboard summary
        function updateDashboard() {
            const totalIncome = budgetData.income.reduce((sum, item) => sum + parseFloat(item.amount || 0), 0);
            const totalExpenses = budgetData.expenses.reduce((sum, item) => sum + parseFloat(item.amount || 0), 0);
            const totalSavings = budgetData.savings.reduce((sum, item) => sum + parseFloat(item.monthlyAmount || 0), 0);
            const totalFunMoney = budgetData.funMoney.reduce((sum, item) => sum + parseFloat(item.amount || 0), 0);
            
            const available = totalIncome - totalExpenses - totalSavings - totalFunMoney;
            
            document.getElementById('totalIncome').textContent = `$${totalIncome.toFixed(2)}`;
            document.getElementById('totalExpenses').textContent = `$${totalExpenses.toFixed(2)}`;
            document.getElementById('totalSavings').textContent = `$${totalSavings.toFixed(2)}`;
            document.getElementById('availableMoney').textContent = `$${available.toFixed(2)}`;
            
            // Change color based on available money
            const availableElement = document.getElementById('availableMoney');
            if (available < 0) {
                availableElement.style.color = '#e74c3c';
            } else if (available < 100) {
                availableElement.style.color = '#f39c12';
            } else {
                availableElement.style.color = '#2ecc71';
            }
        }
        
        // Render all lists
        function renderAllLists() {
            renderIncomeList();
            renderExpensesList();
            renderSavingsList();
            renderFunMoneyList();
        }
        
        // Render income list
        function renderIncomeList() {
            const list = document.getElementById('incomeList');
            if (budgetData.income.length === 0) {
                list.innerHTML = '<div class="empty-state"><h4>No income sources yet</h4><p>Add your income sources to get started</p></div>';
                return;
            }
            
            list.innerHTML = budgetData.income.map(item => `
                <div class="item">
                    <div class="item-info">
                        <div class="item-name">${item.name}</div>
                        ${item.notes ? `<div class="item-category">${item.notes}</div>` : ''}
                    </div>
                    <div class="item-amount">$${parseFloat(item.amount).toFixed(2)}</div>
                    <div class="item-actions">
                        <button class="btn btn-danger" onclick="confirmDelete('income', '${item.id}')">Delete</button>
                    </div>
                </div>
            `).join('');
        }
        
        // Render expenses list
        function renderExpensesList() {
            const list = document.getElementById('expensesList');
            if (budgetData.expenses.length === 0) {
                list.innerHTML = '<div class="empty-state"><h4>No fixed expenses yet</h4><p>Add your monthly expenses to track your budget</p></div>';
                return;
            }
            
            list.innerHTML = budgetData.expenses.map(item => `
                <div class="item">
                    <div class="item-info">
                        <div class="item-name">${item.name}</div>
                        <div class="item-category">${item.category}${item.dueDate ? ` • Due: ${item.dueDate}` : ''}</div>
                        ${item.notes ? `<div class="item-category">${item.notes}</div>` : ''}
                    </div>
                    <div class="item-amount">$${parseFloat(item.amount).toFixed(2)}</div>
                    <div class="item-actions">
                        <button class="btn btn-danger" onclick="confirmDelete('expenses', '${item.id}')">Delete</button>
                    </div>
                </div>
            `).join('');
        }
        
        // Render savings list
        function renderSavingsList() {
            const list = document.getElementById('savingsList');
            if (budgetData.savings.length === 0) {
                list.innerHTML = '<div class="empty-state"><h4>No savings goals yet</h4><p>Set your savings goals to build your future</p></div>';
                return;
            }
            
            list.innerHTML = budgetData.savings.map(item => {
                const progress = (parseFloat(item.currentAmount || 0) / parseFloat(item.targetAmount)) * 100;
                const monthsToGoal = Math.ceil((parseFloat(item.targetAmount) - parseFloat(item.currentAmount || 0)) / parseFloat(item.monthlyAmount));
                
                return `
                    <div class="item">
                        <div class="item-info" style="flex: 2;">
                            <div class="item-name">${item.name}</div>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${Math.min(progress, 100)}%"></div>
                            </div>
                            <div class="progress-text">
                                $${parseFloat(item.currentAmount || 0).toFixed(2)} of $${parseFloat(item.targetAmount).toFixed(2)} 
                                (${progress.toFixed(1)}%)
                                ${monthsToGoal > 0 ? ` • ${monthsToGoal} months to go` : ' • Goal reached!'}
                            </div>
                            ${item.notes ? `<div class="item-category">${item.notes}</div>` : ''}
                        </div>
                        <div class="item-amount">$${parseFloat(item.monthlyAmount).toFixed(2)}/mo</div>
                        <div class="item-actions">
                            <button class="btn btn-danger" onclick="confirmDelete('savings', '${item.id}')">Delete</button>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        // Render fun money list
        function renderFunMoneyList() {
            const list = document.getElementById('funMoneyList');
            if (budgetData.funMoney.length === 0) {
                list.innerHTML = '<div class="empty-state"><h4>No fun money budget yet</h4><p>Allocate money for activities and date nights</p></div>';
                return;
            }
            
            list.innerHTML = budgetData.funMoney.map(item => `
                <div class="item">
                    <div class="item-info">
                        <div class="item-name">${item.name}</div>
                        <div class="item-category">${item.category} • ${item.priority} Priority</div>
                        ${item.notes ? `<div class="item-category">${item.notes}</div>` : ''}
                    </div>
                    <div class="item-amount">$${parseFloat(item.amount).toFixed(2)}</div>
                    <div class="item-actions">
                        <button class="btn btn-danger" onclick="confirmDelete('funMoney', '${item.id}')">Delete</button>
                    </div>
                </div>
            `).join('');
        }
        
        // Form handlers
        document.getElementById('incomeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const item = {
                id: Date.now().toString(),
                name: document.getElementById('incomeName').value,
                amount: document.getElementById('incomeAmount').value,
                notes: document.getElementById('incomeNotes').value,
                createdAt: new Date().toISOString()
            };
            
            budgetData.income.push(item);
            await saveBudgetData();
            updateDashboard();
            renderIncomeList();
            e.target.reset();
        });
        
        document.getElementById('expenseForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const item = {
                id: Date.now().toString(),
                name: document.getElementById('expenseName').value,
                amount: document.getElementById('expenseAmount').value,
                category: document.getElementById('expenseCategory').value,
                dueDate: document.getElementById('expenseDueDate').value,
                notes: document.getElementById('expenseNotes').value,
                createdAt: new Date().toISOString()
            };
            
            budgetData.expenses.push(item);
            await saveBudgetData();
            updateDashboard();
            renderExpensesList();
            e.target.reset();
        });
        
        document.getElementById('savingsForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const item = {
                id: Date.now().toString(),
                name: document.getElementById('savingsName').value,
                targetAmount: document.getElementById('savingsTarget').value,
                monthlyAmount: document.getElementById('savingsMonthly').value,
                currentAmount: document.getElementById('savingsCurrent').value || '0',
                notes: document.getElementById('savingsNotes').value,
                createdAt: new Date().toISOString()
            };
            
            budgetData.savings.push(item);
            await saveBudgetData();
            updateDashboard();
            renderSavingsList();
            e.target.reset();
        });
        
        document.getElementById('funMoneyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const item = {
                id: Date.now().toString(),
                name: document.getElementById('funName').value,
                amount: document.getElementById('funAmount').value,
                category: document.getElementById('funCategory').value,
                priority: document.getElementById('funPriority').value,
                notes: document.getElementById('funNotes').value,
                createdAt: new Date().toISOString()
            };
            
            budgetData.funMoney.push(item);
            await saveBudgetData();
            updateDashboard();
            renderFunMoneyList();
            e.target.reset();
        });
        
        function confirmDelete(type, id) {
            if (confirm('Are you sure you want to delete this item?')) {
                deleteItem(type, id);
            }
        }
        
        // Load data on page load
        loadBudgetData();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
            position: relative;
        }
        
        .back-home {
            position: absolute;
            top: 20px;
            left: 20px;
        }

        .btn-home {
            display: inline-block;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            text-decoration: none;
            border-radius: 20px;
            font-size: 14px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s;
        }

        .btn-home:hover {
            background: rgba(255, 255, 255, 0.3);
            color: white;
            text-decoration: none;
        }
        
        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }
        
        .form-section {
            padding: 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
        }
        
        .form-group.full-width {
            grid-column: 1 / -1;
        }
        
        label {
            font-weight: 600;
            margin-bottom: 5px;
            color: #333;
            font-size: 0.9em;
        }
        
        input, select, textarea {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        textarea {
            resize: vertical;
            min-height: 80px;
            font-family: inherit;
        }
        
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-delete {
            background: #e74c3c;
            color: white;
            padding: 8px 15px;
            font-size: 0.9em;
        }
        
        .btn-delete:hover {
            background: #c0392b;
        }
        
        .records-section {
            padding: 30px;
        }
        
        .records-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .records-header h2 {
            color: #333;
        }
        
        .filter-group {
            display: flex;
            gap: 10px;
        }
        
        .filter-group select {
            padding: 8px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
        }
        
        .record-card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s;
        }
        
        .record-card:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .record-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }
        
        .record-title {
            flex: 1;
        }
        
        .record-title h3 {
            color: #667eea;
            margin-bottom: 5px;
            font-size: 1.2em;
        }
        
        .record-type {
            display: inline-block;
            padding: 4px 12px;
            background: #667eea;
            color: white;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }
        
        .record-meta {
            display: flex;
            gap: 20px;
            color: #666;
            font-size: 0.9em;
            margin-bottom: 10px;
        }
        
        .record-meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .record-description {
            color: #555;
            line-height: 1.6;
            margin-bottom: 10px;
        }
        
        .record-notes {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 5px;
            color: #666;
            font-size: 0.9em;
            font-style: italic;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
        
        .empty-state svg {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
            opacity: 0.3;
        }
        
        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            
            .records-header {
                flex-direction: column;
                gap: 15px;
            }
            
            .filter-group {
                width: 100%;
                flex-direction: column;
            }
            
            .filter-group select {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="back-home">
                <a href="/" class="btn-home">← Home</a>
            </div>
            <h1>🔧 Maintenance Tracker</h1>
            <p>Keep track of all your maintenance activities</p>
        </div>
        
        <div class="form-section">
            <form id="maintenanceForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="itemType">Item Type</label>
                        <select id="itemType" required>
                            <option value="">Select type...</option>
                            <option value="Water Filter">Water Filter</option>
                            <option value="Air Filter">Air Filter</option>
                            <option value="HVAC System">HVAC System</option>
                            <option value="Appliance">Appliance</option>
                            <option value="Vehicle">Vehicle</option>
                            <option value="Equipment">Equipment</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="itemName">Item Name</label>
                        <input type="text" id="itemName" placeholder="e.g., Kitchen Water Filter" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="maintenanceDate">Date</label>
                        <input type="date" id="maintenanceDate" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="maintenanceTime">Time</label>
                        <input type="time" id="maintenanceTime" required>
                    </div>
                    
                    <div class="form-group full-width">
                        <label for="description">Description</label>
                        <textarea id="description" placeholder="What maintenance was performed?" required></textarea>
                    </div>
                    
                    <div class="form-group full-width">
                        <label for="notes">Additional Notes (optional)</label>
                        <textarea id="notes" placeholder="Any additional information..."></textarea>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary">Add Maintenance Record</button>
            </form>
        </div>
        
        <div class="records-section">
            <div class="records-header">
                <h2>Maintenance History</h2>
                <div class="filter-group">
                    <select id="filterType">
                        <option value="">All Types</option>
                        <option value="Water Filter">Water Filter</option>
                        <option value="Air Filter">Air Filter</option>
                        <option value="HVAC System">HVAC System</option>
                        <option value="Appliance">Appliance</option>
                        <option value="Vehicle">Vehicle</option>
                        <option value="Equipment">Equipment</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>
            
            <div id="recordsList"></div>
        </div>
    </div>
    
    <script src="/auth.js"></script>
    <script>
        let records = [];
        
        // Set today's date and current time as default
        document.getElementById('maintenanceDate').valueAsDate = new Date();
        const now = new Date();
        document.getElementById('maintenanceTime').value = now.toTimeString().slice(0, 5);
        
        // Load records from server
        async function loadRecords() {
            try {
                const response = await fetch('/api/maintenance');
                records = await response.json();
                renderRecords();
            } catch (error) {
                console.error('Error loading records:', error);
            }
        }
        
        // Save record to server
        async function saveRecord(record) {
            try {
                const response = await pinAuth.authenticatedFetch('/api/maintenance', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(record)
                });
                return await response.json();
            } catch (error) {
                console.error('Error saving record:', error);
                alert('Failed to save record');
            }
        }
        
        // Delete record from server
        async function deleteRecord(id) {
            try {
                await pinAuth.authenticatedFetch(`/api/maintenance/${id}`, {
                    method: 'DELETE'
                });
                records = records.filter(r => r.id !== id);
                renderRecords();
            } catch (error) {
                console.error('Error deleting record:', error);
                alert('Failed to delete record');
            }
        }
        
        // Handle form submission
        document.getElementById('maintenanceForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const record = {
                id: Date.now().toString(),
                itemType: document.getElementById('itemType').value,
                itemName: document.getElementById('itemName').value,
                date: document.getElementById('maintenanceDate').value,
                time: document.getElementById('maintenanceTime').value,
                description: document.getElementById('description').value,
                notes: document.getElementById('notes').value,
                createdAt: new Date().toISOString()
            };
            
            const result = await saveRecord(record);
            if (result && result.success) {
                records.push(record);
                renderRecords();
                e.target.reset();
                // Reset to current date/time
                document.getElementById('maintenanceDate').valueAsDate = new Date();
                document.getElementById('maintenanceTime').value = new Date().toTimeString().slice(0, 5);
            }
        });
        
        // Filter records
        document.getElementById('filterType').addEventListener('change', renderRecords);
        
        // Render records
        function renderRecords() {
            const filterType = document.getElementById('filterType').value;
            const filteredRecords = filterType 
                ? records.filter(r => r.itemType === filterType)
                : records;
            
            const recordsList = document.getElementById('recordsList');
            
            if (filteredRecords.length === 0) {
                recordsList.innerHTML = `
                    <div class="empty-state">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
                        </svg>
                        <h3>No maintenance records yet</h3>
                        <p>Start by adding your first maintenance record above</p>
                    </div>
                `;
                return;
            }
            
            // Sort by date and time (newest first)
            filteredRecords.sort((a, b) => {
                const dateA = new Date(a.date + ' ' + a.time);
                const dateB = new Date(b.date + ' ' + b.time);
                return dateB - dateA;
            });
            
            recordsList.innerHTML = filteredRecords.map(record => `
                <div class="record-card">
                    <div class="record-header">
                        <div class="record-title">
                            <h3>${record.itemName}</h3>
                            <span class="record-type">${record.itemType}</span>
                        </div>
                        <button class="btn btn-delete" onclick="confirmDelete('${record.id}')">Delete</button>
                    </div>
                    <div class="record-meta">
                        <span>📅 ${formatDate(record.date)}</span>
                        <span>🕐 ${formatTime(record.time)}</span>
                    </div>
                    <div class="record-description">${record.description}</div>
                    ${record.notes ? `<div class="record-notes">Note: ${record.notes}</div>` : ''}
                </div>
            `).join('');
        }
        
        function confirmDelete(id) {
            if (confirm('Are you sure you want to delete this maintenance record?')) {
                deleteRecord(id);
            }
        }
        
        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('en-US', { 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            });
        }
        
        function formatTime(timeStr) {
            const [hours, minutes] = timeStr.split(':');
            const hour = parseInt(hours);
            const ampm = hour >= 12 ? 'PM' : 'AM';
            const displayHour = hour % 12 || 12;
            return `${displayHour}:${minutes} ${ampm}`;
        }
        
        // Load records on page load
        loadRecords();
    </script>
</body>
</html>

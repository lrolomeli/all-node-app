<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Node Apps Menu</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        .app-card { border: 1px solid #ddd; border-radius: 8px; padding: 20px; margin: 15px 0; text-decoration: none; display: block; color: #333; }
        .app-card:hover { background: #f5f5f5; }
        h1 { text-align: center; color: #333; }
    </style>
</head>
<body>
    <h1>Node Applications</h1>
    <a href="/schedule" class="app-card">
        <h3>Schedule App</h3>
        <p>Manage your schedules and appointments</p>
    </a>
    <a href="/checklist" class="app-card">
        <h3>Checklist App</h3>
        <p>Create and manage your task checklists</p>
    </a>
</body>
</html>

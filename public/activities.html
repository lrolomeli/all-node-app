<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Future Activities</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.2em;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }

        .back-home {
            position: absolute;
            top: 20px;
            left: 20px;
        }

        .btn-home {
            display: inline-block;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            text-decoration: none;
            border-radius: 20px;
            font-size: 14px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn-home:hover {
            background: rgba(255, 255, 255, 0.3);
            color: white;
        }

        .form-section {
            padding: 30px;
            border-bottom: 1px solid #e0e0e0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 0.9em;
        }

        label:has(+ input[required])::after,
        label:has(+ select[required])::after,
        label:has(+ textarea[required])::after {
            content: " *";
            color: #dc3545;
        }

        .required-note {
            font-size: 0.8em;
            color: #666;
            margin-bottom: 15px;
            font-style: italic;
        }

        input, select, textarea {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            transition: border-color 0.3s;
            font-family: inherit;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .activities-section {
            padding: 30px;
        }

        .activities-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .activities-header h2 {
            color: #333;
            font-weight: 300;
        }

        .filter-group {
            display: flex;
            gap: 10px;
        }

        .filter-group select {
            padding: 8px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 0.9em;
        }

        .activity-card {
            background: white;
            border: 2px solid #f0f0f0;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            transition: all 0.3s;
            position: relative;
        }

        .activity-card:hover {
            border-color: #667eea;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .activity-card.completed {
            background: #f8f9fa;
            border-color: #28a745;
        }

        .activity-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }

        .activity-title {
            flex: 1;
        }

        .activity-title h3 {
            color: #667eea;
            margin-bottom: 8px;
            font-size: 1.3em;
        }

        .activity-category {
            display: inline-block;
            padding: 4px 12px;
            background: #667eea;
            color: white;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
        }

        .activity-meta {
            display: flex;
            gap: 20px;
            color: #666;
            font-size: 0.9em;
            margin-bottom: 15px;
        }

        .activity-meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .activity-description {
            color: #555;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .activity-actions {
            display: flex;
            gap: 10px;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 0.85em;
            border-radius: 6px;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-success:hover {
            background: #218838;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state h3 {
            margin-bottom: 10px;
            color: #666;
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            
            .activities-header {
                flex-direction: column;
                gap: 15px;
            }
            
            .filter-group {
                width: 100%;
                flex-direction: column;
            }
            
            .activity-header {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="back-home">
                <a href="/" class="btn-home">← Home</a>
            </div>
            <h1>💕 Our Future Adventures</h1>
            <p>Activities we want to do together</p>
        </div>
        
        <div class="form-section">
            <form id="activityForm">
                <p class="required-note">* Required field. All other fields are optional and will use default values if left empty.</p>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="activityName">Activity Name *</label>
                        <input type="text" id="activityName" placeholder="e.g., Visit Paris" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="category">Category (optional)</label>
                        <select id="category">
                            <option value="">Select category (defaults to Other)...</option>
                            <option value="Travel">🌍 Travel</option>
                            <option value="Food">🍽️ Food & Dining</option>
                            <option value="Adventure">🏔️ Adventure</option>
                            <option value="Culture">🎭 Culture & Arts</option>
                            <option value="Relaxation">🧘 Relaxation</option>
                            <option value="Learning">📚 Learning</option>
                            <option value="Sports">⚽ Sports</option>
                            <option value="Other">✨ Other</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="priority">Priority (optional)</label>
                        <select id="priority">
                            <option value="">Select priority (defaults to Medium)...</option>
                            <option value="High">🔥 High</option>
                            <option value="Medium">⭐ Medium</option>
                            <option value="Low">💭 Low</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="addedBy">Added by (optional)</label>
                        <select id="addedBy">
                            <option value="">Who added this (optional)?</option>
                            <option value="Zuzu">💕 Zuzu</option>
                            <option value="Cici">💖 Cici</option>
                        </select>
                    </div>
                    
                    <div class="form-group full-width">
                        <label for="description">Description (optional)</label>
                        <textarea id="description" placeholder="Tell us more about this activity (optional)..."></textarea>
                    </div>
                    
                    <div class="form-group full-width">
                        <label for="notes">Notes (optional)</label>
                        <textarea id="notes" placeholder="Any additional thoughts or requirements..."></textarea>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary">Add to Our List</button>
            </form>
        </div>
        
        <div class="activities-section">
            <div class="activities-header">
                <h2>Our Activity Wishlist</h2>
                <div class="filter-group">
                    <select id="filterCategory">
                        <option value="">All Categories</option>
                        <option value="Travel">🌍 Travel</option>
                        <option value="Food">🍽️ Food & Dining</option>
                        <option value="Adventure">🏔️ Adventure</option>
                        <option value="Culture">🎭 Culture & Arts</option>
                        <option value="Relaxation">🧘 Relaxation</option>
                        <option value="Learning">📚 Learning</option>
                        <option value="Sports">⚽ Sports</option>
                        <option value="Other">✨ Other</option>
                    </select>
                    <select id="filterPriority">
                        <option value="">All Priorities</option>
                        <option value="High">🔥 High</option>
                        <option value="Medium">⭐ Medium</option>
                        <option value="Low">💭 Low</option>
                    </select>
                    <select id="filterAddedBy">
                        <option value="">All Contributors</option>
                        <option value="Zuzu">💕 Zuzu</option>
                        <option value="Cici">💖 Cici</option>
                        <option value="Unknown">❓ Unknown</option>
                    </select>
                </div>
            </div>
            
            <div id="activitiesList"></div>
        </div>
    </div>
    
    <script src="/auth.js"></script>
    <script>
        let activities = [];
        
        // Load activities from server
        async function loadActivities() {
            try {
                const response = await fetch('/api/activities');
                activities = await response.json();
                renderActivities();
            } catch (error) {
                console.error('Error loading activities:', error);
            }
        }
        
        // Save activity to server
        async function saveActivity(activity) {
            try {
                console.log('Attempting to save activity:', activity);
                
                const response = await pinAuth.authenticatedFetch('/api/activities', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(activity)
                });
                
                console.log('Response status:', response.status);
                
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('Server error:', errorText);
                    throw new Error(`Server error: ${response.status} - ${errorText}`);
                }
                
                const result = await response.json();
                console.log('Server response:', result);
                return result;
            } catch (error) {
                console.error('Error saving activity:', error);
                throw error;
            }
        }
        
        // Mark activity as completed
        async function completeActivity(id) {
            try {
                await pinAuth.authenticatedFetch(`/api/activities/${id}/complete`, {
                    method: 'PUT'
                });
                const activity = activities.find(a => a.id === id);
                if (activity) {
                    activity.completed = true;
                    activity.completedDate = new Date().toISOString();
                }
                renderActivities();
            } catch (error) {
                console.error('Error completing activity:', error);
                alert('Failed to mark as completed');
            }
        }
        
        // Delete activity
        async function deleteActivity(id) {
            try {
                await pinAuth.authenticatedFetch(`/api/activities/${id}`, {
                    method: 'DELETE'
                });
                activities = activities.filter(a => a.id !== id);
                renderActivities();
            } catch (error) {
                console.error('Error deleting activity:', error);
                alert('Failed to delete activity');
            }
        }
        
        // Handle form submission
        document.getElementById('activityForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const activityName = document.getElementById('activityName').value.trim();
            
            // Only require activity name - all other fields are optional
            if (!activityName) {
                alert('Please enter an activity name (this is the only required field)');
                document.getElementById('activityName').focus();
                return;
            }
            
            const activity = {
                id: Date.now().toString(),
                name: activityName,
                category: document.getElementById('category').value || 'Other',
                priority: document.getElementById('priority').value || 'Medium',
                addedBy: document.getElementById('addedBy').value || 'Unknown',
                description: document.getElementById('description').value || '',
                notes: document.getElementById('notes').value || '',
                completed: false,
                createdAt: new Date().toISOString()
            };
            
            console.log('Submitting activity:', activity);
            
            try {
                const result = await saveActivity(activity);
                console.log('Save result:', result);
                
                if (result && result.success) {
                    activities.push(activity);
                    renderActivities();
                    e.target.reset();
                    alert('Activity added successfully! 🎉');
                } else {
                    console.error('Save failed:', result);
                    alert('Failed to save activity. Please try again.');
                }
            } catch (error) {
                console.error('Error submitting activity:', error);
                alert('Error saving activity: ' + error.message);
            }
        });
        
        // Filter activities
        document.getElementById('filterCategory').addEventListener('change', renderActivities);
        document.getElementById('filterPriority').addEventListener('change', renderActivities);
        document.getElementById('filterAddedBy').addEventListener('change', renderActivities);
        
        // Render activities
        function renderActivities() {
            const filterCategory = document.getElementById('filterCategory').value;
            const filterPriority = document.getElementById('filterPriority').value;
            const filterAddedBy = document.getElementById('filterAddedBy').value;
            
            let filteredActivities = activities.filter(activity => {
                return (!filterCategory || activity.category === filterCategory) &&
                       (!filterPriority || activity.priority === filterPriority) &&
                       (!filterAddedBy || activity.addedBy === filterAddedBy);
            });
            
            const activitiesList = document.getElementById('activitiesList');
            
            if (filteredActivities.length === 0) {
                activitiesList.innerHTML = `
                    <div class="empty-state">
                        <h3>No activities yet</h3>
                        <p>Start adding activities you want to do together!</p>
                    </div>
                `;
                return;
            }
            
            // Sort by priority and date
            const priorityOrder = { 'High': 3, 'Medium': 2, 'Low': 1 };
            filteredActivities.sort((a, b) => {
                if (a.completed !== b.completed) {
                    return a.completed ? 1 : -1; // Completed items go to bottom
                }
                if (priorityOrder[a.priority] !== priorityOrder[b.priority]) {
                    return priorityOrder[b.priority] - priorityOrder[a.priority];
                }
                return new Date(b.createdAt) - new Date(a.createdAt);
            });
            
            activitiesList.innerHTML = filteredActivities.map(activity => `
                <div class="activity-card ${activity.completed ? 'completed' : ''}">
                    <div class="activity-header">
                        <div class="activity-title">
                            <h3>${activity.name} ${activity.completed ? '✅' : ''}</h3>
                            <span class="activity-category">${getCategoryIcon(activity.category)} ${activity.category}</span>
                        </div>
                    </div>
                    <div class="activity-meta">
                        <span>🔥 ${activity.priority}</span>
                        <span>👤 ${activity.addedBy}</span>
                        <span>📅 ${formatDate(activity.createdAt)}</span>
                        ${activity.completed ? `<span>✅ Completed ${formatDate(activity.completedDate)}</span>` : ''}
                    </div>
                    <div class="activity-description">${activity.description}</div>
                    ${activity.notes ? `<div class="activity-notes"><strong>Notes:</strong> ${activity.notes}</div>` : ''}
                    <div class="activity-actions">
                        ${!activity.completed ? `<button class="btn btn-success btn-small" onclick="confirmComplete('${activity.id}')">Mark as Done</button>` : ''}
                        <button class="btn btn-danger btn-small" onclick="confirmDelete('${activity.id}')">Delete</button>
                    </div>
                </div>
            `).join('');
        }
        
        function getCategoryIcon(category) {
            const icons = {
                'Travel': '🌍',
                'Food': '🍽️',
                'Adventure': '🏔️',
                'Culture': '🎭',
                'Relaxation': '🧘',
                'Learning': '📚',
                'Sports': '⚽',
                'Other': '✨'
            };
            return icons[category] || '✨';
        }
        
        function confirmComplete(id) {
            if (confirm('Mark this activity as completed?')) {
                completeActivity(id);
            }
        }
        
        function confirmDelete(id) {
            if (confirm('Are you sure you want to delete this activity?')) {
                deleteActivity(id);
            }
        }
        
        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('en-US', { 
                year: 'numeric', 
                month: 'short', 
                day: 'numeric' 
            });
        }
        
        // Load activities on page load
        loadActivities();
    </script>
</body>
</html>

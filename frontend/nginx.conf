server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 1. REDIRECCIONES DE "CLEAN URLS" (Lo que hacía tu middleware)
    # Si entran sin barra a cualquier app, les agregamos la barra /
    rewrite ^(/apps/(diet|schedule|checklist|cv|calisthenics|maintenance|gastos|room-monitor|shopping-list))$ $1/ permanent;

    # 2. PROXY AL SENSOR ESP (para room-monitor)
    location /api/sensors {
        proxy_pass http://192.168.100.239;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # 3. PROXY AL BACKEND (Opción A: Contenedores en el mismo servidor)
    location /api/ {
        proxy_pass http://backend:3000; # 'backend' es el nombre en el docker-compose
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # También para tus rutas de autenticación
    location /auth/ {
        proxy_pass http://backend:3000;
    }

    # 3. MANEJO DE RUTAS PARA CADA APP (MPA)
    # Esto permite que React Router funcione dentro de cada subcarpeta
    location /apps/cv/ {
        try_files $uri $uri/ /apps/cv/index.html;
    }

    location /apps/shopping-list/ {
        try_files $uri $uri/ /apps/shopping-list/index.html;
    }

    # ...puedes agregar una regla general para el resto de /apps/
    location /apps/ {
        try_files $uri $uri/ /index.html;
    }

    # 4. CONFIGURACIÓN GENERAL PARA EL HOME
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optimización: Caché para archivos estáticos (JS, CSS, Imágenes)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Dieta</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container mt-5">
    <div class="text-center mb-3">
      <a href="/" class="btn btn-secondary">← Volver al Inicio</a>
    </div>
    <h1 class="text-center mb-4">Mi Plan de Dieta</h1>
    <table id="diet-table" class="table table-bordered table-hover">
      <thead class="table-light">
        <tr>
          <th>Comida</th>
          <th>Proteína</th>
          <th>Cereales</th>
          <th>Leguminosas</th>
          <th>Frutas</th>
          <th>Verduras</th>
          <th>Lácteos</th>
          <th>Grasas</th>
          <th>Azúcar</th>
        </tr>
      </thead>
      <tbody>
        <!-- Las filas de la tabla se generarán dinámicamente con JavaScript -->
      </tbody>
    </table>
    <!-- Botón para desmarcar todas las casillas -->
    <div class="text-center mt-4">
      <button id="reset-button" class="btn btn-danger">Desmarcar Todas</button>
    </div>
  </div>

  <!-- Bootstrap JS y dependencias -->
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
  <script src="/diet/script.js"></script>
</body>
</html>
